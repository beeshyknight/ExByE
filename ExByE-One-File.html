/* ExByE Hallam-inspired teaching colourway.
   Sheffield Hallam brand reference palette (October 2026):
   Hallam Maroon #672146, Collegiate Crimson #AC145A,

   Sheffield Steel #5B6770, HUBS Silver #D0D3D4.

   The original desktop layout and behavioural controls are unchanged. */

  font-family:Arial,Tahoma,"Segoe UI",sans-serif;

function appointmentsPage(){let date=ui.apptDate;let booked=db.appointments.filter(x=>x.date===date);let times=[];for(let h=8;h<17;h++)for(let m of [0,30])times.push(String(h).padStart(2,'0')+':'+String(m).padStart(2,'0'));let staff=['GP / Prescriber','Practice nurse','Community nurse','Social worker'];const cell=(time,staffName)=>{let a=booked.find(x=>x.time===time&&(x.professional===staffName||staffName==='GP / Prescriber'&&/GP|prescrib/i.test(x.professional)||staffName==='Community nurse'&&/student team|review/i.test(x.professional)));return a?`<button class="plain-btn tiny" style="width:100%;white-space:normal;background:#F4CDD4;text-align:left" data-apptid="${esc(a.id)}"><b>${esc(patient(a.patientId)?.name||'Patient')}</b><br>${esc(a.kind)} · ${esc(a.status)}</button>`:`<button class="plain-btn tiny" data-slot="${time}" data-staff="${esc(staffName)}" style="width:100%;color:#5B6770;background:#FAFAFA">+ available</button>`};return `<div class="desk-view">${panelHeading('Appointments Ledger')}<div class="strip">${button('◀ Previous Day','prevday')}<label>Date <input type="date" id="apptdate" value="${date}"></label>${button('Next Day ▶','nextday')} ${button('Book Appointment','appointment','primary')}${button('Refresh','refresh')}<span class="muted">Select an available slot to book an appointment</span></div>${table(['Time',...staff],times.map(t=>tr([`<b>${t}</b>`,...staff.map(s=>cell(t,s))])))}</div>`;}

function openDialog(type,id=null,meta={}){if(type==='audit-export'){exportAudit();return}if(type==='help'||type==='about'||type==='tree-preferences'){ui.dialog={type,id,...meta};render();return}if(type==='report-export'){const rows=[['Identifier','Name','Service','Journal Entries','Medications','Open Tasks'],...db.patients.map(y=>[y.id,y.name,y.service,nr('journal',y.id),nr('medications',y.id),list('tasks',y.id).filter(t=>t.status==='Open').length])];download(csv(rows),'ExByE-caseload.csv','text/csv');return}if(type==='import'){const input=document.createElement('input');input.type='file';input.accept='application/json,.json';input.onchange=async()=>{try{const data=JSON.parse(await input.files[0].text());if(!Array.isArray(data.patients)||!Array.isArray(data.journal)||!Array.isArray(data.tasks))throw Error('The file is not an ExByE backup');db=data;v4Initialise();safeSave();ui.patientId=null;ui.page='home';render();alert('Backup imported.')}catch(e){alert('Could not import backup: '+e.message)}};input.click();return}if(type==='recent')type='search';if(['consult','handover','medication','problem','note','observation','allergy','code','vaccination','careplan','recall','document','referral','assessment','sharing','edit-details','details','appointment','task','result'].includes(type)&&!p()&&!['task','appointment','result','referral'].includes(type)){type='search'}ui.dialog={type,id,...meta};ui.menu='';ui.context=null;render();if(type==='search')setTimeout(()=>$('#modal-find')?.focus(),30)}

function templateInputs(template){return (window.EXBYE_TEMPLATES[template]||[]).map((s,i)=>fd('part'+i,s,'',{kind:'textarea',full:true,rows:2})).join('')}
function searchResults(query){let q=(query||'').toLowerCase().trim();let patients=db.patients.filter(x=>!q||`${x.name} ${x.id} ${x.service} ${x.setting}`.toLowerCase().includes(q)).slice(0,60);return table(['Name','Date of birth / age','Record ID','Organisation / service'],patients.map(y=>tr([`<b>${esc(y.name)}</b>`,`${esc(y.age)} years`,esc(y.id),esc(y.service)],`class="clickable ${ui.selectedSearch===y.id?'highlight':''}" data-searchid="${esc(y.id)}"`)),'No patient matches this search.');}
function renderDialog(){let v=dialogContent();return `<div class="modal-shade" id="shade"><section class="dialog ${['consult','assessment','document','handover'].includes(v.type)?'wide':''}" role="dialog" aria-modal="true" aria-labelledby="dialog-label"><div class="dialog-title"><div><span class="panel-kicker">EXBYE · ${p()?esc(p().name):'WORKSPACE'}</span><h2 id="dialog-label">${esc(v.title)}</h2></div><button type="button" data-action="close-dialog" aria-label="Close panel">×</button></div><div class="dialog-body">${v.body}</div><div class="dialog-actions">${button('Cancel','close-dialog')}${v.type==='search'?button('Open Record','select-patient','primary'):v.type==='reset'?button(v.save,'confirm-reset','danger'):v.body.includes('<form')?`<button type="submit" class="plain-btn primary" form="dialog-form">${esc(v.save)}</button>`:button('Close','close-dialog','primary')}</div></section></div>`;}
function formHandler(form){let t=form.dataset.kind;let d=Object.fromEntries(new FormData(form).entries());let id=ui.dialog?.id,x=p(),pid=d.patientId||ui.patientId||db.patients[0].id;const add=(type,obj)=>db[type].unshift({id:uid(type.slice(0,2).toUpperCase()),patientId:pid,...obj});const today=stamp();
try{
switch(t){
case'new-patient':{let n=Math.max(0,...db.patients.map(x=>Number((x.id||'').replace(/\D/g,''))||0))+1;pid='EXB-P-'+String(n).padStart(4,'0');db.patients.push({id:pid,name:d.name,age:Number(d.age),pronouns:d.pronouns,service:d.service,setting:d.setting,gp:d.gp,contact:d.contact,concern:d.concern,about:d.about,needs:d.needs,sharing:'Not yet discussed',registered:today,scenarioStage:0,archived:false});ui.patientId=pid;ui.node='Patient Home';ui.page='patient';if(!ui.openPatients.includes(pid))ui.openPatients.push(pid);break}
case'consult':{let blocks=[['History',d.history],['Examination',d.examination],['Diagnosis / formulation',d.diagnosis],['Intervention',d.intervention],['Plan',d.plan]].filter(a=>a[1]?.trim());add('journal',{date:d.date||today,type:'Consultation · '+d.contact,note:blocks.map(y=>y[0]+':\n'+y[1]).join('\n\n'),author:ui.role,status:'Signed',source:'Consultation'});ui.node='New Journal';ui.page='patient';break}
 case'handover':{let note=[['Situation',d.situation],['The person’s views',d.personView],['Background',d.background],['Assessment / uncertainties',d.assessment],['Agreed actions and follow-up',d.actions],['Communication and access',d.communication]].filter(r=>r[1]?.trim()).map(r=>r[0]+':\n'+r[1]).join('\n\n');add('journal',{date:d.date||today,type:'Structured handover',note,author:ui.role,status:'Signed',source:'Shared handover'});ui.node='Handover';ui.page='patient';break;}
case'note':add('journal',{date:d.date||today,type:d.noteType,note:d.text,author:ui.role,status:'Signed',source:'Clinical note'});ui.node='New Journal';ui.page='patient';break;
case'medication':add('medications',{name:d.name,dose:d.dose,frequency:d.frequency,type:d.type,status:d.status,date:d.date,prescriber:ui.role});ui.node='Medication';ui.page='patient';break;
case'problem':add('problems',{title:d.title,status:d.status,date:d.date,notes:d.notes});ui.node='All Problems';ui.page='patient';break;
case'allergy':add('allergies',{substance:d.substance,reaction:d.reaction,date:d.date});ui.node='Sensitivities & Allergies';ui.page='patient';break;
case'observation':add('observations',{type:d.type,value:d.value,unit:d.unit,date:d.date,author:ui.role});ui.node='Observations';ui.page='patient';break;
case'code':add('clinicalCodes',{concept:d.concept,code:'LOC-'+String(window.EXBYE_CODES.indexOf(d.concept)+1).padStart(3,'0'),date:d.date,status:d.status,notes:d.notes});ui.node='Code Journal';ui.page='patient';break;
case'result':add('labResults',{date:d.date,test:d.test,value:d.value,unit:d.unit,status:d.status,notes:d.notes,author:ui.role});if(p()){ui.node='Pathology Results';ui.page='patient'}else ui.page='results-inbox';break;
case'vaccination':add('vaccinations',{date:d.date,name:d.name,notes:d.notes});ui.node='Vaccinations';ui.page='patient';break;
case'recall':add('recalls',{title:d.title,due:d.due,status:d.status,notes:d.notes});ui.node='Recalls';ui.page='patient';break;
case'careplan':{let data={title:d.title,goal:d.goal,actions:d.actions,personView:d.personView,status:d.status,reviewDate:d.reviewDate,author:ui.role};let rec=db.carePlans.find(y=>y.id===id);if(rec)Object.assign(rec,data);else add('carePlans',data);ui.node='Care Plans';ui.page='patient';break}
case'referral':{pid=d.patientId||pid;let data={service:d.service,reason:d.reason,priority:d.priority,status:d.status,date:d.date,referrer:ui.role};let rec=db.referrals.find(y=>y.id===id);if(rec){Object.assign(rec,data);pid=rec.patientId;}else add('referrals',data);if(ui.page==='patient'&&p()){ui.node='Referrals'}else ui.page='referrals';break}
case'task':{let data={title:d.title,assignedTo:d.assignedTo,priority:d.priority,due:d.due,status:d.status,notes:d.notes};let rec=db.tasks.find(y=>y.id===id);if(rec){Object.assign(rec,data);pid=rec.patientId;}else add('tasks',data);if(ui.page==='patient'&&p()){ui.node='Tasks'}else ui.page='tasks';break}
case'appointment':{let data={date:d.date,time:d.time,professional:d.professional,kind:d.kind,status:d.status,notes:d.notes};let rec=db.appointments.find(y=>y.id===id);if(rec){Object.assign(rec,data);pid=rec.patientId;}else add('appointments',data);if(ui.page==='patient'&&p()){ui.node='Appointments'}else ui.page='appointments';break}
case'document':add('documents',{date:d.date,title:d.title,type:d.type,body:d.body,author:ui.role});ui.node='Communications & Letters';ui.page='patient';break;
case'assessment':{let parts=window.EXBYE_TEMPLATES[d.template]||[];let body=parts.map((y,i)=>[y,d['part'+i]]).filter(y=>y[1]?.trim()).map(y=>y[0]+':\n'+y[1]).join('\n\n');if(!body)throw Error('Please enter at least one assessment response.');add('assessments',{date:d.date,template:d.template,body,author:ui.role});add('journal',{date:d.date,type:'Clinical template · '+d.template,note:body,author:ui.role,status:'Signed',source:'Data entry template'});ui.node='Risk Assessments';ui.page='patient';break}

case'edit-details':Object.assign(x,{name:d.name,age:Number(d.age),pronouns:d.pronouns,setting:d.setting,service:d.service,gp:d.gp,contact:d.contact,about:d.about,needs:d.needs});ui.node='Patient Details';ui.page='patient';break;
case'preferences':if(window.EXBYE_CONNECTED)throw Error('Please sign in with your professional account.');ui.role=d.role;db.preferences.role=d.role;break;
default:throw Error('This form is not available: '+t);
}
log('Saved '+t,pid);ui.dialog=null;render();toast('Saved '+t+' to the shared record');scrollTop();
}catch(e){alert(e.message);console.error(e)}

function launchStage(pid){if(window.EXBYE_CONNECTED&&!v4Administrator())return;let sc=db.scenarios.find(x=>x.patientId===pid);if(!sc||sc.stage>=sc.stages.length)return;const stage=sc.stage+1;let txt=sc.stages[sc.stage];db.journal.unshift({id:uid('J'),patientId:pid,date:stamp(),type:'New information · stage '+stage,note:txt,author:'Clinical update',status:'Signed',source:'Stage-'+stage});sc.stage=stage;let x=patient(pid);if(x)x.scenarioStage=stage;log('Released staged information '+stage,pid);render();toast('New case information now appears in the patient journal');}
function resetStage(pid){if(window.EXBYE_CONNECTED&&!v4Administrator())return;const sc=db.scenarios.find(s=>s.patientId===pid);if(!sc)return;if(!confirm('Restore this record to its starting stage? Existing professional notes will remain.'))return;db.journal=db.journal.filter(x=>!(x.patientId===pid&&/^Stage-\d+$/.test(x.source||'')));sc.stage=0;let x=patient(pid);if(x)x.scenarioStage=0;log('Reset staged developments',pid);render();}

function v4ScorePage(){return `<div class="desk-view v4-module">${panelHeading('Assessment calculators','Record observations and interpret screening scores alongside professional judgement.')}<div class="v4-help"><strong>NEWS2:</strong> Adult scoring follows the Royal College of Physicians NEWS2 parameters; SpO₂ Scale 2 requires a clinician-authorised target. <strong>MUST:</strong> Nutritional screening follows BAPEN’s published criteria (www.bapen.org.uk). Check scores, observations and escalation against applicable clinical guidance.</div><div class="v4-score-grid"><section class="v4-entry"><h2>NEWS2 observation set</h2><form id="v4-news-form"><div class="v4-fields">${[['rr','Respiratory rate /min',12],['spo2','SpO₂ %',97],['sbp','Systolic BP mmHg',120],['pulse','Pulse /min',76],['temperature','Temperature °C',36.8]].map(([name,label,val])=>`<label class="v4-field"><span>${label}</span><input type="number" name="${name}" step="${name==='temperature'?'0.1':'1'}" min="0" value="${val}" required></label>`).join('')}<label class="v4-field"><span>SpO₂ scoring scale</span><select name="scale"><option value="1">Scale 1 (standard)</option><option value="2">Scale 2 (clinician-authorised only)</option></select></label><label class="v4-field"><span>Supplemental oxygen</span><select name="oxygen"><option value="no">Room air</option><option value="yes">Receiving oxygen</option></select></label><label class="v4-field"><span>Consciousness</span><select name="consciousness"><option value="alert">Alert, no new confusion</option><option value="confusion">New confusion</option><option value="voice">Responds to voice</option><option value="pain">Responds to pain</option><option value="unresponsive">Unresponsive</option></select></label><label class="v4-field v4-wide"><span>Clinical concern / follow-up</span><textarea name="actions" placeholder="Assessment, concerns and actions taken"></textarea></label></div><button class="v4-submit">Calculate and save NEWS2</button></form></section> function v4News(form){const d=Object.fromEntries(new FormData(form));let rr=+d.rr,spo2=+d.spo2,sbp=+d.sbp,pulse=+d.pulse,temp=+d.temperature; if(rr<1||rr>80||spo2<1||spo2>100||sbp<20||sbp>350||pulse<1||pulse>250||temp<25||temp>45)throw Error('One or more values fall outside the permitted ranges.');

 const sat=d.scale==='2'?spo2<=83?3:spo2<=85?2:spo2<=87?1:spo2<=92?0:d.oxygen==='no'?0:spo2<=94?1:spo2<=96?2:3:spo2<=91?3:spo2<=93?2:spo2<=95?1:0;
 const bp=sbp<=90?3:sbp<=100?2:sbp<=110?1:sbp<220?0:3;
 const pul=pulse<=40?3:pulse<=50?1:pulse<=90?0:pulse<=110?1:pulse<=130?2:3;
 const tp=temp<=35?3:temp<=36?1:temp<=38?0:temp<=39?1:2;
 const av=d.consciousness==='alert'?0:3, ox=d.oxygen==='yes'?2:0;
 const scores={respiration:resp,oxygenSaturation:sat,supplementalOxygen:ox,systolicBP:bp,pulse:pul,temperature:tp,consciousness:av};const total=Object.values(scores).reduce((a,b)=>a+b,0);
 const band=total>=7?'High aggregate (7+)':total>=5?'Medium aggregate (5–6)':Math.max(...Object.values(scores))===3?'Single parameter scoring 3':total>=1?'Low aggregate (1–4)':'Score 0';
 return {total,band,scores,inputs:d,note:`NEWS2 (SpO₂ scale ${d.scale}) = ${total}. ${band}. ${d.actions||'No follow-up documented.'}`};}
function v4Must(form){const d=Object.fromEntries(new FormData(form));let h=+d.height,w=+d.weight,prev=+d.previousWeight;if(h<.5||h>2.5||w<=0||prev<=0)throw Error('Check the height and weights.');const bmi=w/(h*h),loss=d.unplanned==='no'?0:Math.max(0,(prev-w)/prev*100),b=bmi<18.5?2:bmi<=20?1:0,l=loss>10?2:loss>=5?1:0,a=d.acute==='yes'?2:0,total=b+l+a;return {total,band:total>=2?'High risk':total===1?'Medium risk':'Low risk',scores:{bmi:b,weightLoss:l,acuteDisease:a},inputs:{...d,bmi:Math.round(bmi*10)/10,weightLossPercent:Math.round(loss*10)/10},note:`MUST = ${total} (${total>=2?'High':total===1?'Medium':'Low'} risk). BMI ${bmi.toFixed(1)}, unplanned loss ${loss.toFixed(1)}%. ${d.actions||'No follow-up documented.'}`};}

function depthSaveStructured(kind,store,source,form,required){if(!p())throw Error('Open a record first.');if(v4ReadOnly())throw Error('Read-only profile.');let d=Object.fromEntries(new FormData(form));if(!String(d[required]||'').trim())throw Error('Complete '+required+' before saving.');let x={...d,id:uid('D'),patientId:ui.patientId,date:d.date||stamp(),author:v4User().id+' · '+v4User().role};db.ext[store].unshift(x);db.assessments.unshift({id:uid('AS'),patientId:ui.patientId,date:x.date,template:kind,body:Object.entries(d).map(([k,v])=>k+': '+v).join('\n'),author:x.author});db.journal.unshift({id:uid('J'),patientId:ui.patientId,date:x.date,type:kind,note:Object.entries(d).filter(([k,v])=>String(v).trim()).map(([k,v])=>k+': '+v).join('\n'),author:x.author,status:'Signed',source});log('Recorded '+kind);render();toast(kind+' saved')}
function depthComputeScore(form){let d=Object.fromEntries(new FormData(form));let needed=['rr','spo2','sbp','pulse','temperature'];if(needed.some(k=>d[k]===''))throw Error('Complete all five physiological measurements.');if(d.scale==='2'&&d.scale2Authorised!=='Yes')throw Error('SpO₂ Scale 2 must be authorised by a clinician.');if(d.oxygen==='yes'&&(!d.oxygenFlow||!d.device))throw Error('Enter oxygen flow and delivery device.');let rr=Number(d.rr),spo=Number(d.spo2),bp=Number(d.sbp),pul=Number(d.pulse),temp=Number(d.temperature);if(rr<1||rr>80||spo<1||spo>100||bp<20||bp>350||pul<1||pul>250||temp<25||temp>45)throw Error('An observation is outside the permitted input range.');
 let scores={respiration:rr<=8?3:rr<=11?1:rr<=20?0:rr<=24?2:3,
 oxygenSaturation:d.scale==='2'?(spo<=83?3:spo<=85?2:spo<=87?1:spo<=92?0:d.oxygen==='no'?0:spo<=94?1:spo<=96?2:3):(spo<=91?3:spo<=93?2:spo<=95?1:0),
 supplementalOxygen:d.oxygen==='yes'?2:0,systolicBP:bp<=90?3:bp<=100?2:bp<=110?1:bp<220?0:3,
 pulse:pul<=40?3:pul<=50?1:pul<=90?0:pul<=110?1:pul<=130?2:3,temperature:temp<=35?3:temp<=36?1:temp<=38?0:temp<=39?1:2,consciousness:d.consciousness==='alert'?0:3};
 const total=Object.values(scores).reduce((a,b)=>a+b,0),single=Object.values(scores).some(x=>x===3),band=total>=7?'High (7+)':total>=5?'Medium (5–6)':single?'Single parameter 3':total>=1?'Low (1–4)':'0';return {inputs:d,scores,total,band};}

const v56RecordKinds=['tasks','medications','referrals','carePlans','recalls','labResults','observations','appointments','documents','assessments','problems','clinicalCodes'];
let v56Snapshot=new Map(); let v56LastJournal=new Set();
function v56TakeSnapshot(){v56Snapshot=new Map();for(const k of v56RecordKinds){for(const x of db[k]||[])v56Snapshot.set(k+'|'+x.id,JSON.stringify(x))}v56LastJournal=new Set(db.journal.map(x=>x.id))}
function v56CaptureUpdates(){
 const alreadyNew=new Set(db.journal.filter(x=>!v56LastJournal.has(x.id)).map(x=>x.patientId));
 const names={tasks:'Task',medications:'Medication',referrals:'Referral',carePlans:'Care plan',recalls:'Recall',labResults:'Investigation',observations:'Observation',appointments:'Appointment',documents:'Document',assessments:'Assessment',problems:'Problem',clinicalCodes:'Coded problem'};
 for(const kind of v56RecordKinds){for(const x of db[kind]||[]){const key=kind+'|'+x.id,old=v56Snapshot.get(key),now=JSON.stringify(x);if(old===now||!x.patientId||x.deletedAt)continue;
  // When a form already wrote its own detailed clinical journal entry, do not duplicate it.
  if(!old&&alreadyNew.has(x.patientId))continue;
  const changed=!!old;let desc=x.title||x.name||x.service||x.test||x.type||x.concept||x.template||'Record entry';let status=x.status||x.value||'';
  db.journal.unshift({id:uid('J'),patientId:x.patientId,date:stamp(),type:names[kind]+(changed?' updated':' recorded'),note:`${desc}${status?' · '+status:''}\nSource reference: ${x.id}${x.assignedTo?'\nAllocated to: '+x.assignedTo:''}${x.due?'\nDue: '+x.due:''}${x.reviewDate?'\nReview: '+x.reviewDate:''}`,author:ui.role,status:'Signed',source:'Record change',linkedType:kind,linkedId:x.id});
 }}v56TakeSnapshot();
}

 <label class="ex-flow-field"><span>Care plan reviewed</span><select name="planId"><option value="">Not linked to a plan</option>${v57Options(plans.map(x=>[x.id,x.title+' · review '+nice(x.reviewDate)]),'')}</select></label>
 <label class="ex-flow-field"><span>Progress against linked goal</span><select name="progress">${v57Options([['Not reviewed','Not reviewed'],['Improving','Improving'],['Unchanged','Unchanged'],['Deteriorating','Deteriorating'],['Achieved','Achieved'],['Reassess','Requires reassessment']],'Not reviewed')}</select></label>
 <label class="ex-flow-field"><span>Risk status since previous contact</span><select name="riskStatus">${v57Options([['No change identified','No change identified'],['Changed – requires review','Changed – requires review'],['Urgent reassessment','Urgent reassessment'],['Not assessed','Not assessed']],'No change identified')}</select></label>
 ${v57Field('riskEvidence','Changed risk, protective factors or new evidence')}${v57Field('safeguarding','Safeguarding action or consideration')}${v57Field('decisions','Clinical / social care decisions and rationale')}${v57Field('actions','Agreed action, person responsible and outcome measure')}
 <label class="ex-flow-field"><span>Allocate follow-up task</span><select name="owner"><option value="">No task needed</option>${v57Options(v57TeamMembers().map(u=>[u.id,u.id+' · '+u.role]),'')}</select></label>${v57Field('followup','Task due / next review','', 'date')}</div><div class="strip"><button class="plain-btn primary" type="submit">Sign contact and update record</button><button type="button" class="plain-btn" data-action="v57-cancel">Return to record</button></div></form>
 ${past.length?`<h3>Recent contacts</h3>${table(['Date','Type','Recorded by','Linked plan'],past.map(x=>tr([nice(x.date),esc(x.kind),esc(x.author),esc(db.carePlans.find(c=>c.id===x.planId)?.title||'—')])))}`:''}</div>`}
function v57SaveVisit(form){if(!accessCanSee(ui.patientId))throw Error('Patient record unavailable');let d=Object.fromEntries(new FormData(form));if(!d.reason?.trim()||!d.observations?.trim()||!d.personView?.trim())throw Error('Record the reason for contact, observations and the person’s views.');if(d.weight && (+d.weight<=0||+d.weight>500))throw Error('Check recorded weight');let rec={id:uid('VI'),patientId:ui.patientId,date:d.date||stamp(),author:signedInId,...d};db.ext.visits.unshift(rec);
 if(d.weight){db.observations.unshift({id:uid('OB'),patientId:ui.patientId,date:rec.date,type:'Weight',value:d.weight,unit:'kg',author:signedInId,linkedVisitId:rec.id,notes:d.weightContext||''})}
 if(d.planId&&d.progress!=='Not reviewed'){const cp=db.carePlans.find(x=>x.id===d.planId&&x.patientId===ui.patientId);if(cp){db.ext.planReviews ||= [];db.ext.planReviews.unshift({id:uid('RV'),patientId:ui.patientId,planId:cp.id,date:rec.date,progress:d.progress,evidence:d.observations,personView:d.personView,decision:d.progress==='Achieved'?'Consider closure':'Continue or revise plan',author:signedInId,linkedVisitId:rec.id});cp.lastReviewed=rec.date;cp.latestProgress=d.progress}}
 if(d.riskStatus!=='No change identified'&&d.riskStatus!=='Not assessed')db.tasks.unshift({id:uid('TK'),patientId:ui.patientId,title:'Review risk formulation after '+d.kind,assignedTo:d.owner||signedInId,priority:d.riskStatus==='Urgent reassessment'?'Urgent':'Soon',due:d.followup||stamp(),status:'Open',notes:d.riskEvidence||d.riskStatus,linkedVisitId:rec.id});
 if(d.owner&&d.actions?.trim())db.tasks.unshift({id:uid('TK'),patientId:ui.patientId,title:'Follow-up after '+d.kind,assignedTo:d.owner,priority:'Routine',due:d.followup||stamp(),status:'Open',notes:d.actions,linkedVisitId:rec.id,linkedPlanId:d.planId||''});
 if(d.followup)db.recalls.unshift({id:uid('RC'),patientId:ui.patientId,title:'Review following '+d.kind,due:d.followup,status:'Due',linkedVisitId:rec.id,linkedPlanId:d.planId||'',assignedTo:d.owner||signedInId,notes:d.actions});
 db.journal.unshift({id:uid('J'),patientId:ui.patientId,date:rec.date,type:rec.kind,note:`Reason: ${d.reason}\nPresent: ${d.people||'Not recorded'}\nFindings: ${d.observations}\nPerson's views: ${d.personView}\nWeight: ${d.weight?d.weight+' kg · '+(d.weightContext||''): 'Not recorded'}\nCare plan: ${db.carePlans.find(x=>x.id===d.planId)?.title||'None selected'} (${d.progress})\nRisk: ${d.riskStatus} · ${d.riskEvidence||''}\nSafeguarding: ${d.safeguarding||'Not recorded'}\nDecisions: ${d.decisions||'Not recorded'}\nActions: ${d.actions||'Not recorded'}`,author:signedInId,status:'Signed',source:'Contact',linkedVisitId:rec.id,linkedPlanId:d.planId||''});log('Recorded '+d.kind);ui.page='patient';ui.node='New Journal';render();toast('Contact recorded')}
function v57ContactsPage(){const contacts=p().nextOfKin||[];return `<div class="desk-view ex-pathways v57-area">${panelHeading('Contacts and next of kin')}<div class="mini-panel"><p><b>Patient</b> ${esc(p().name)} · ${esc(p().contact||'')}</p></div>${contacts.length?table(['Name / identifier','Relationship','Contact','Type / authority','Preferences'],contacts.map(c=>tr([esc(c.name),esc(c.relationship),esc(c.contact),esc(c.authority||'Contact only'),esc(c.preference||'')]))) : '<p>No next of kin recorded.</p>'}<form id="v57-contact-form" class="ex-flow-form"><h3>Add contact</h3><div class="ex-flow-grid">${v57Field('name','Contact name or identifier')}${v57Field('relationship','Relationship to person')}${v57Field('contact','Contact details')}${v57Field('preference','Preferred contact, information sharing, restrictions')}<label class="ex-flow-field"><span>Verified legal authority</span><select name="authority">${v57Options([['Contact only','Contact only – no automatic decision-making authority'],['Parental responsibility verified','Parental responsibility verified'],['Health and welfare LPA verified','Health and welfare LPA verified'],['Deputyship order verified','Relevant deputyship order verified'],['Other authority – verify evidence','Other – evidence requires verification']], 'Contact only')}</select></label>${v57Field('evidence','Evidence and restrictions for legal authority')}</div><button class="plain-btn primary" type="submit">Add contact to record</button></form></div>`}
function v57SaveContact(form){let d=Object.fromEntries(new FormData(form));if(!d.name?.trim()||!d.relationship?.trim())throw Error('Record contact name and relationship.');p().nextOfKin ||= [];p().nextOfKin.push({id:uid('NK'),...d});db.journal.unshift({id:uid('J'),patientId:ui.patientId,date:stamp(),type:'Contact details updated',note:`${d.name} · ${d.relationship} · ${d.authority}`,author:signedInId,status:'Signed',source:'Patient details'});log('Updated next of kin');render()}
// Restore full professional templates in one clear place, without replacing the existing tools.
recordNav.push(['Care and assessment','Professional assessments','Professional assessments','v57-professional'],['Working together','Record contact or visit','Record contact or visit','v57-visit'],['Understand','Contacts and next of kin','Contacts and next of kin','v57-contacts']);
const v57PriorPatientPage=patientPage;
patientPage=function(){if(ui.node==='Professional assessments')return v57AssessmentsPage();if(ui.node==='Record contact or visit')return v57VisitPage();if(ui.node==='Contacts and next of kin')return v57ContactsPage();return v57PriorPatientPage()};
const v57PriorHome=patientHome;
patientHome=function(){let base=v57PriorHome(), plans=db.carePlans.filter(x=>x.patientId===ui.patientId&&x.status!=='Closed'),due=plans.filter(x=>x.reviewDate&&x.reviewDate<=stamp()),forms=v57List('pathwayAssessments').filter(x=>x.status==='Draft'),notices=[];
 if(due.length)notices.push(`<button class="plain-btn tiny" data-node="Care Plans">${due.length} care plan review${due.length===1?'':'s'} due</button>`);
 if(forms.length)notices.push(`<button class="plain-btn tiny" data-node="Professional assessments">${forms.length} assessment draft${forms.length===1?'':'s'}</button>`);
 return `<div class="v57-patient-actions"><button class="plain-btn primary" data-node="Record contact or visit">Record contact / visit</button><button class="plain-btn" data-node="Professional assessments">Professional assessments</button><button class="plain-btn" data-node="Contacts and next of kin">Next of kin</button>${notices.join('')}</div>`+base};
const v57PriorRisk=depthRiskPage;
depthRiskPage=function(){return `<div class="strip"><button class="plain-btn primary" data-v57-form="risk">Complete risk and safety formulation</button></div>`+v57PriorRisk()};
const v57PriorContent=content;
content=function(){if(ui.page==='v57-form')return v57FormPage();if(ui.page==='v57-visit')return v57VisitPage();return v57PriorContent()};
app.addEventListener('click',e=>{const el=e.target.closest('[data-v57-form],[data-action]');if(!el)return;
 if(el.dataset.v57Form){e.preventDefault();e.stopImmediatePropagation();ui.v57FormType=el.dataset.v57Form;ui.v57FormId=el.dataset.v57Id||null;ui.page='v57-form';render();return}
 if(el.dataset.action==='v57-cancel'){e.preventDefault();e.stopImmediatePropagation();ui.page='patient';ui.node='Professional assessments';render();return}
},true);
app.addEventListener('submit',e=>{const form=e.target;if(!['v57-assessment-form','v57-visit-form','v57-contact-form'].includes(form.id))return;e.preventDefault();e.stopImmediatePropagation();try{if(form.id==='v57-assessment-form')v57SaveForm(form,e.submitter?.value||'Draft');else if(form.id==='v57-visit-form')v57SaveVisit(form);else v57SaveContact(form)}catch(err){alert(err.message);console.error(err)}},true);

})();

</script>
</body>
